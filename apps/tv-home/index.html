<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Home</title>
<style>
  :root {
    --tile-w: 320px; --tile-h: 192px; --gap-x: 44px; --row-h: 300px; /* pickers (with names); = PICK_ROW_H. Home grid and folders: set by applyGrid() in app.js */
    --cols: 5; --grid-top: 640px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #0d0d0f; color: #fff;
    font-family: "LG Smart UI", "Museo Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Wallpaper: fixed behind everything; dims when scrolled or a menu is open. */
  #wall { /* wallpaper + readability gradient in ONE full-screen layer */
    position: fixed; inset: 0; background-color: #0d0d0f;
    background-position: center; background-size: cover; background-repeat: no-repeat;
  }
  #wall.none { background-image: radial-gradient(90% 80% at 50% 30%, #26262c, #0d0d0f 70%); }
  #wall > img { position: absolute; left: 0; top: 0; }   /* the picture (showWallpaper in app.js) */
  #wall:not(.none)::after { /* readability gradient over it */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, transparent 18%, transparent 48%, rgba(0,0,0,.55) 75%, rgba(0,0,0,.75) 100%);
  }
  /* Dim overlay: a plain solid-colour layer that stays promoted (never hidden),
     so scrolling never creates/uploads a full-screen texture mid-animation.
     Fading the wallpaper image itself was measured slower (4K blend). */
  #wallDim { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity 400ms; will-change: opacity; }
  body.scrolled #wallDim { opacity: .55; }
  body.overlay #wallDim { opacity: .6; }

  /* Black until the first screen is complete (reveal() in app.js): at boot the
     TV is busy and the wallpaper and cards would otherwise fill in visibly. */
  #cover { position: fixed; inset: 0; z-index: 100; background: #000; transition: opacity 350ms; }
  #cover.gone { opacity: 0; }

  #page { position: absolute; inset: 0; transition: transform 420ms cubic-bezier(.2,.8,.2,1), opacity 250ms; will-change: transform; }
  body.overlay #page { opacity: .08; }

  .grid {
    position: absolute; left: 0; width: 1920px;
    display: grid; justify-content: center;
    grid-template-columns: repeat(var(--cols), var(--tile-w));
    column-gap: var(--gap-x); grid-auto-rows: var(--row-h);
  }
  #grid { top: var(--grid-top); }

  /* ---- Tiles ---- */
  .tile { position: relative; width: var(--tile-w); height: var(--row-h); }
  .tile::before { /* focus shadow: pre-promoted layer, only opacity animates (no filter) */
    content: ""; position: absolute; left: 8%; right: 8%; top: 30px; height: 170px;
    border-radius: 30px; box-shadow: 0 34px 60px rgba(0,0,0,.7);
    opacity: 0; transition: opacity 200ms; will-change: opacity;
  }
  .card {
    position: relative; width: var(--tile-w); height: var(--tile-h);
    border-radius: 22px; overflow: hidden; background: var(--c, #2a2a2e);
    transition: transform 200ms cubic-bezier(.2,.8,.2,1); transform-origin: 50% 50%;
    will-change: transform;
  }
  .card > img, .card > canvas {
    position: absolute; left: 50%; top: 50%; width: 136px; height: 136px;
    transform: translate(-50%, -50%); object-fit: contain;
  }
  .card.bleed > img, .card.bleed > canvas { width: var(--tile-h); height: var(--tile-h); }
  /* A sharp logo from the app's splash screen (makeLogos in app.js). */
  .card.haslogo > img, .card.haslogo > canvas { width: 66%; height: 40%; }
  .card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.18)); }
  .card .gloss {
    position: absolute; inset: 0; opacity: 0; transition: opacity 200ms; will-change: opacity;
    background: radial-gradient(120% 90% at 20% 0%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%);
  }
  .label {
    margin-top: 26px; text-align: center; font-size: 26px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateY(-6px); transition: opacity 200ms, transform 200ms;
    text-shadow: 0 2px 6px rgba(0,0,0,.7); will-change: opacity, transform;
  }
  .tile.focus { z-index: 2; }
  .tile.focus::before { opacity: 1; }
  .tile.focus .card { transform: scale(1.12) translateY(-4px); }
  .tile.focus .gloss { opacity: 1; }
  .tile.focus .label { opacity: 1; transform: translateY(8px); }
  /* Settings > App names off: no names on the home screen and in folders (pickers keep them). */
  body:not(.names) #grid .label, body:not(.names) .folderView:not(.picker) .label { display: none; }
  /* Settings > Look > Selected app: Bar. A slim bar floating under the focused card,
     fading out to both sides. No layer of its own (no will-change): one per
     card made the first moves stutter on the TV; repainting 4 px is cheap. */
  body.bar:not(.names):not(.editing) #grid .tile::after, body.bar:not(.names):not(.editing) .folderView:not(.picker) .tile::after {
    content: ""; position: absolute; left: 12%; right: 12%; top: 206px; height: 4px; border-radius: 2px;   /* ~6 px under the enlarged card */
    background: linear-gradient(90deg, transparent, var(--bar, #fff) 30%, var(--bar, #fff) 70%, transparent);
    opacity: 0; transition: opacity 200ms;
  }
  body.bar:not(.names):not(.editing) #grid .tile.focus::after, body.bar:not(.names):not(.editing) .folderView:not(.picker) .tile.focus::after { opacity: var(--bar-o, .8); }
  /* With the bar, the focused card keeps its own colours (no white shine). */
  body.bar:not(.names):not(.editing) #grid .tile.focus .gloss, body.bar:not(.names):not(.editing) .folderView:not(.picker) .tile.focus .gloss { opacity: 0; }

  /* Move mode: the picked-up tile floats and wobbles slightly. */
  .tile.moving .card { transform: scale(1.18) translateY(-10px); outline: 4px solid rgba(255,255,255,.9); outline-offset: 4px; }
  .tile.moving .label { opacity: 1; transform: translateY(14px); }

  /* Folder tile: frosted card with up to six mini app cards. */
  .card.folder { background: rgba(255,255,255,.16); }
  .minis {
    position: absolute; inset: 18px 22px; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px;
  }
  .mini { position: relative; border-radius: 10px; overflow: hidden; background: var(--c, #2a2a2e); }
  .mini img, .mini canvas { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); object-fit: contain; }
  .mini.bleed img, .mini.bleed canvas { width: 100%; height: 100%; object-fit: cover; }

  /* Top-left buttons: three squares as wide as one card (3 x 96 + 2 x 16). */
  #topbar { position: absolute; top: 40px; left: 72px; display: flex; gap: 16px; z-index: 3; }
  .tbtn {
    position: relative; width: 96px; height: 96px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 160ms, background 160ms;
    /* Dark glass: a translucent surface with a thin light edge and a soft
       highlight on top. No backdrop blur (costly on the TV; the wallpaper
       behind is soft anyway). The focus and "on" colours below still win. */
    background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.08), 0 10px 26px rgba(0,0,0,.35);
  }
  .tbtn svg { width: 46px; height: 46px; fill: #fff; }
  .tbtn.on { background: rgba(52,199,89,.55); }
  .tbtn.focus { background: #fff; transform: scale(1.12); }
  .tbtn.focus svg { fill: #111; }
  .tbtn .tlabel {
    position: absolute; top: 112px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 22px; font-weight: 500;
    opacity: 0; transition: opacity 160ms; text-shadow: 0 2px 6px rgba(0,0,0,.8);
  }
  .tbtn.focus .tlabel { opacity: 1; }
  /* Light button feedback ring (outline: no repaint of the layer below). */
  .tbtn { outline: 5px solid transparent; outline-offset: 5px; transition: transform 160ms, background 160ms, outline-color 200ms; }
  .tbtn.flash-ok { outline-color: #34c759; }
  .tbtn.flash-err { outline-color: #ff453a; }

  /* Settings > Look > App cards: Glass. Dark glass like the top-left buttons
     (no backdrop blur: costly on the TV); the logos are keyed in app.js. */
  body.glass .card.app, body.glass .mini {
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05)), rgba(18,18,22,.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.24), inset 0 0 0 1px rgba(255,255,255,.09);
  }
  body.glass .card.app .shade { display: none; }
  /* No focus shadow on Glass: its layer (narrower than the card, shifted
     down) shows through the see-through card as a brighter, off-centre box. */
  body.glass .tile::before { display: none; }

  /* Full-card tile art (tiles/<appId>.png). */
  .card.art > img, .card.art > canvas, .mini.art img, .mini.art canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: none; left: 0; top: 0; }

  /* Edit mode: every movable tile gets a dashed outline. */
  body.editing .tile .card:not(.settings) { outline: 3px dashed rgba(255,255,255,.45); outline-offset: 6px; }
  body.editing .tile.focus .card:not(.settings) { outline-style: solid; outline-color: #fff; }

  /* Settings / pen / edit-mode cards */
  .card.settings { background: linear-gradient(160deg, #4a4a52, #24242a); }
  .card.settings svg { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; transform: translate(-50%, -50%); }

  #clock {
    position: fixed; top: 44px; right: 72px; font-size: 34px; font-weight: 500;
    letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.6); z-index: 5;
  }
  #clock.off { display: none; }
  #msg {
    position: fixed; left: 0; right: 0; top: 780px; text-align: center;
    font-size: 30px; color: rgba(255,255,255,.8); display: none;
  }
  #hint { /* pill so it stays readable over scrolled tiles */
    position: fixed; left: 50%; top: 40px; transform: translateX(-50%); z-index: 30;
    font-size: 24px; color: #fff; display: none; white-space: nowrap;
    background: rgba(0,0,0,.72); padding: 12px 28px; border-radius: 30px;
  }


  /* Pills: small rounded buttons (crop bar, Remote Buttons). */
  .pill { padding: 18px 30px; border-radius: 40px; font-size: 26px; background: rgba(255,255,255,.12); transition: transform 150ms, background 150ms; cursor: pointer; }
  .pill.sel { background: #fff; color: #111; transform: scale(1.06); }

  /* ---- Overlays (folder view, menus, text input) ---- */
  .layer { position: fixed; inset: 0; z-index: 20; }
  .folderView .title {
    position: absolute; top: 210px; left: 0; right: 0; text-align: center;
    font-size: 52px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  .folderView .inner { position: absolute; inset: 0; transition: transform 400ms cubic-bezier(.2,.8,.2,1); }
  .folderView .grid { top: 340px; }
  .folderView .empty { position: absolute; top: 420px; left: 0; right: 0; text-align: center; font-size: 30px; color: rgba(255,255,255,.75); }

  /* Picture folders: a 2x2 mosaic of the folder's pictures. */
  .card.album { background: #1c1c20; }
  .card.album .mos { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; }
  .card.album .mos div { background: center / cover no-repeat #2a2a30; }
  .card.album .mos.n0, .card.album .mos.n1, .card.album .mos.n2 { grid-template-rows: 1fr; }
  .card.album .mos.n1 { grid-template-columns: 1fr; }
  .card.album .mos.n3 div:first-child { grid-row: span 2; }
  .card.album .count { position: absolute; right: 12px; bottom: 10px; padding: 2px 10px; border-radius: 12px;
    background: rgba(0,0,0,.6); font-size: 20px; font-weight: 600; }



  /* Crop screen (USB wallpapers) */
  .cropView { background: #070708; }
  .cropView img { position: absolute; }
  .cropView .frame {
    position: absolute; border: 3px solid rgba(255,255,255,.8); border-radius: 6px;
    box-shadow: 0 0 0 4000px rgba(0,0,0,.62); cursor: move;
  }
  .cropView .frame.sel { border-color: #fff; outline: 3px solid rgba(255,255,255,.35); outline-offset: 4px; }
  .cropbar { position: absolute; left: 0; right: 0; top: 968px; display: flex; justify-content: center; gap: 22px; }
  .cropbar .pill { min-width: 90px; text-align: center; }
  .cropbar .pill.save { background: rgba(52,199,89,.45); }
  .cropbar .pill.save.sel { background: #34c759; color: #fff; }
  .crophint { position: absolute; left: 0; right: 0; top: 16px; text-align: center; font-size: 24px; color: rgba(255,255,255,.9); }

  /* Card picker (Add Apps, folder apps, uninstall, remote app choice) */
  .picker .tile .badge {
    position: absolute; top: -14px; right: -14px; width: 48px; height: 48px; border-radius: 50%;
    background: #34c759; display: none; align-items: center; justify-content: center; z-index: 4;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .picker .tile .badge svg { width: 30px; height: 30px; fill: #fff; }
  .picker .pickhint { position: absolute; top: 278px; left: 0; right: 0; text-align: center; font-size: 24px; color: rgba(255,255,255,.9); }
  /* Side picker (next to the remote drawing): right half, 3 columns. */
  .picker.side .grid { left: 700px; width: 1160px; justify-content: start; grid-template-columns: repeat(3, var(--tile-w)); }
  .picker.side .title { left: 700px; right: auto; width: 1048px; }
  body.editing .picker .tile .card { outline: none; }
  .picker .tile.picked .badge { display: flex; }
  /* ★ on favourite pictures (top left, the ✓ badge is top right) */
  .picker .tile .fav { position: absolute; top: 8px; left: 12px; z-index: 4; font-size: 34px; color: #ffd60a;
    text-shadow: 0 2px 6px rgba(0,0,0,.8); pointer-events: none; }
  .picker .tile.pickable:not(.picked) .card { opacity: .35; }
  .picker .tile.pickable:not(.picked).focus .card { opacity: .7; }
  .picker.remove .tile .badge { background: #ff453a; }
  .picker.remove .tile.picked .card { opacity: .5; }

  .panel {
    position: absolute; top: 90px; bottom: 90px; right: 90px; width: 860px;
    background: #1e1e22; border-radius: 30px; padding: 46px 40px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden;
  }
  .panel.sheet { top: 50%; bottom: auto; right: auto; left: 50%; width: 720px; transform: translate(-50%, -50%); }
  .panel h1 { font-size: 46px; font-weight: 600; margin: 0 14px 30px; }
  .panel .sub { font-size: 24px; color: rgba(255,255,255,.6); margin: -18px 14px 26px; }
  /* Rows scroll inside their own clipped area, never over the title. */
  .panel { display: flex; flex-direction: column; }
  .panel.sheet { display: block; }
  .rowsclip { position: relative; flex: 1; min-height: 0; overflow: hidden; margin: 0 -12px; padding: 0 12px; }
  .rows { position: relative; transition: transform 300ms cubic-bezier(.2,.8,.2,1); padding-top: 6px; }
  .row {
    display: flex; align-items: center; height: 78px; padding: 0 26px; margin-bottom: 8px;
    border-radius: 16px; font-size: 30px; transition: transform 150ms, background 150ms;
  }
  .row .val { margin-left: auto; color: rgba(255,255,255,.55); font-size: 26px; padding-left: 20px; white-space: nowrap; }
  .row .chev { margin-left: 18px; color: rgba(255,255,255,.4); }
  .row.info { color: rgba(255,255,255,.85); font-size: 24px; height: auto; padding: 10px 26px; line-height: 1.4; }
  .row.focus { background: #fff; color: #111; transform: scale(1.02); }
  .row.focus .val, .row.focus .chev { color: rgba(0,0,0,.55); }
  .row.danger { color: #ff6b6b; }
  .row.off { opacity: .35; }     /* a switched-off feature's settings */
  .row.focus.danger { color: #c00; }

  /* Hints: remote keys as small key caps, bright enough to read at a glance. */
  .kc { display: inline-block; padding: 1px 10px; margin: 0 3px; border-radius: 9px; border: 2px solid rgba(255,255,255,.75);
    font-size: .82em; font-weight: 700; line-height: 1.35; vertical-align: 1px; white-space: nowrap; }
  .row.focus .kc { border-color: rgba(0,0,0,.6); }
  /* The small "i" and its legend (in a corner, doesn't take the keys). */
  .ibtn { position: absolute; width: 50px; height: 50px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center; font: italic 700 28px Georgia, serif;
    color: rgba(255,255,255,.85); cursor: pointer; transition: transform 150ms, background 150ms; }
  .ibtn.focus { background: #fff; color: #111; border-color: #fff; transform: scale(1.12); }
  .folderView .ibtn { top: 222px; right: 96px; }
  .panel .ibtn { top: 52px; right: 44px; }
  .legend { position: fixed; right: 64px; bottom: 56px; z-index: 36; max-width: 640px; padding: 22px 28px 14px;
    background: rgba(18,18,22,.93); border-radius: 22px; box-shadow: 0 16px 40px rgba(0,0,0,.5); pointer-events: none; }
  .legend.top { top: 64px; bottom: auto; }
  .legend .lt { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
  .legend .ll { font-size: 23px; line-height: 1.5; margin-bottom: 8px; color: rgba(255,255,255,.92); }

  .inputBox input {
    width: 100%; height: 86px; font-size: 36px; padding: 0 24px; border-radius: 16px;
    border: 3px solid #fff; background: #111; color: #fff; outline: none; font-family: inherit;
  }
  .inputBox .sub { margin: 22px 4px 0; }
</style>
<link rel="stylesheet" href="modules.css">
</head>
<body>
<div id="wall"></div>
<div id="wallDim"></div>
<div id="page"><div id="topbar"></div><div id="grid" class="grid"></div></div>
<div id="clock"></div>
<div id="msg"></div>
<div id="hint"></div>
<div id="cover"></div>
<script src="app.js"></script>
<!-- The features chosen in install.sh, bundled from modules/<name>/ (see modules/README.md). -->
<script src="modules.js"></script>
<script>start();</script>
</body>
</html>
